<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><link rel="stylesheet" href="studio.css" /><link
    rel="stylesheet"
    href="premium.css"
  /><title>Kenuxa Video Studio</title>
  <body class="popup">
    <header class="brand">
      <img src="icons/icon48.png" width="42" height="42" alt="Kenuxa" />
      <div><strong>KENUXA</strong><small>VIDEO STUDIO</small></div>
      <span class="version">2.5</span>
    </header>
    <button id="watch" class="watch-cta popup-watch">
      <span>▶</span
      ><strong
        >Kenuxa Watch<small
          >Discover what the community is watching</small
        ></strong
      ><b>↗</b>
    </button>
    <h1>Your next download<br />starts here.</h1>
    <p class="muted" id="source">Current tab</p>
    <div class="popup-count">
      <strong id="count">0</strong>
      <div>
        media sources detected<small
          >Play the video to reveal its streams.</small
        >
      </div>
    </div>
    <button class="primary wide" id="open">
      Open Video Studio <span>↗</span>
    </button>
    <div class="popup-actions">
      <button class="ghost" id="scan">Scan this page</button
      ><button class="ghost" id="home">My videos</button
      ><button class="ghost" id="converter">Convert a file</button>
    </div>
    <p id="message" role="status"></p>
    <footer>LOCAL PROCESSING <span>•</span> NO SUBSCRIPTION</footer>
    <script src="popup.js" type="module"></script>
  </body>
</html>
