name: Validate and package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: |
          mkdir -p artifacts
          for browser in chromium edge opera firefox; do
            (cd dist/$browser && zip -qr ../../artifacts/kenuxa-$browser-v2.4.zip .)
          done
      - uses: actions/upload-artifact@v4
        with:
          name: kenuxa-browser-packages-2.4
          path: artifacts/*.zip
